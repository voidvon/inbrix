name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: Vet
        run: go vet ./...

      # -race matters here specifically: the injected-credential broker seam
      # copies header values out of a POOLED per-request buffer, and the unified
      # inbox fans out one goroutine per connected account. Both are exactly the
      # shapes a non-race run cannot police.
      - name: Test
        run: go test -race ./...

      # site/docs/*.md are GENERATED from the repo's markdown by site/gen and
      # rendered by site/docs.html. The step above already runs this gate as part
      # of `go test ./...`; it is repeated on its own so a docs failure is
      # attributed to the docs rather than buried in the test log.
      #
      # It checks two things, not one. The freshness half (site/docs matches what
      # the generator makes) is what the previous Node gate did. The half it did
      # not do — and the reason the published bundle shipped ten dead links while
      # the gate reported "in sync" — is resolving every link in every published
      # chapter, fragments included, against what site/ actually serves.
      - name: Published docs are in sync and link-clean
        run: go test ./site/gen -count=1 -v

  # site/gen resolves links; it cannot see anything that only exists once the
  # page is laid out. This job renders index.html and docs.html in Chromium at
  # eight viewports in both colour schemes and fails on a stretched screenshot,
  # both theme variants painted at once, a 1x image on a 2x screen, copy under
  # 12px, horizontal overflow, or an anchor with no target — every one of which
  # reads as correct HTML in a diff.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Run the self-test first. It breaks each invariant on purpose and demands
      # the check notice; a render gate that has stopped discriminating looks
      # exactly like one that passes.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs
