name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  ci:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags), not the default shallow
      # fetch-depth: 1. site/gen's TestVersionMatchesLatestTag runs
      # `git describe --tags` to catch VERSION drifting from the latest
      # release tag — the actual cause of the 2026-08-06 version drift — and a
      # shallow checkout carries no tags at all, which would make that check
      # skip on every run instead of ever really gating anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Build
        run: go build ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: Vet
        run: go vet ./...

      # -race matters here specifically: the injected-credential broker seam
      # copies header values out of a POOLED per-request buffer, and the unified
      # inbox fans out one goroutine per connected account. Both are exactly the
      # shapes a non-race run cannot police.
      - name: Test
        run: go test -race ./...

      # site/docs/*.md are GENERATED from the repo's markdown by site/gen and
      # rendered by site/docs.html. The step above already runs this gate as part
      # of `go test ./...`; it is repeated on its own so a docs failure is
      # attributed to the docs rather than buried in the test log.
      #
      # It checks three things now, not one. The freshness half (site/docs
      # matches what the generator makes) is what the previous Node gate did.
      # The link half it did not do — and the reason the published bundle
      # shipped ten dead links while the gate reported "in sync" — is
      # resolving every link in every published chapter, fragments included,
      # against what site/ actually serves. The version half is newer still:
      # site/index.html's hero slug/spec card and site/docs.html's footer must
      # show exactly VERSION, and VERSION must equal the latest git tag (the
      # checkout above fetches full tag history so that comparison is real
      # here, not a permanent skip).
      - name: Published docs are in sync, link-clean, and the version is current
        run: go test ./site/gen -count=1 -v

  # go build/vet strip types without checking client JS at all — the app's
  # security-relevant push/token code (assets/js/, assets/sw.js) previously
  # sat behind no linter and no type checker. tsc runs both projects (one per
  # global environment: browser DOM vs Service Worker — see tsconfig.json /
  # assets/tsconfig.json), then eslint runs type-aware (typescript-eslint
  # recommendedTypeChecked), which is what actually distinguishes this from a
  # build step: no-floating-promises and friends need real type information,
  # not just parsing.
  client-js:
    name: Client JS — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # site/gen resolves links; it cannot see anything that only exists once the
  # page is laid out. This job renders index.html and docs.html in Chromium at
  # eight viewports in both colour schemes and fails on a stretched screenshot,
  # both theme variants painted at once, a 1x image on a 2x screen, copy under
  # 12px, horizontal overflow, or an anchor with no target — every one of which
  # reads as correct HTML in a diff.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Run the self-test first. It breaks each invariant on purpose and demands
      # the check notice; a render gate that has stopped discriminating looks
      # exactly like one that passes.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs
