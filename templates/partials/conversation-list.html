{{define "conversation-list"}}
{{if .Conversations}}
    {{range .Conversations}}
    <button type="button"
            class="conversation-row {{if eq $.SelectedConversationID .ID}}is-active{{end}}"
            hx-get="/api/conversations/{{.ID}}{{if $.Unified}}?unified=1{{end}}"
            hx-target="#chat-pane"
            hx-swap="innerHTML"
            hx-indicator="#conversation-spinner"
            @click="activeConversation = '{{.ID}}'; chatOpen = true">
        <span class="conversation-row__avatar avatar">{{initial .Title .PeerEmail}}</span>
        <span class="conversation-row__body">
            <span class="conversation-row__top">
                <strong class="conversation-row__title">
                    {{if eq .Title "Conversation"}}{{t $.Translations "Conversation"}}{{else}}{{.Title}}{{end}}
                </strong>
                <time class="conversation-row__date">{{formatDate $.Locale .Latest.Date}}</time>
            </span>
            <span class="conversation-row__subject">
                {{if eq .Subject "(no subject)"}}{{t $.Translations "(no subject)"}}{{else}}{{.Subject}}{{end}}
            </span>
            <span class="conversation-row__preview">{{.Preview}}</span>
        </span>
        {{if gt .UnreadCount 0}}<span class="conversation-row__unread">{{.UnreadCount}}</span>{{end}}
    </button>
    {{end}}
{{else}}
    <div class="conversation-empty">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" d="M20 11.5a7.5 7.5 0 01-8 7.5 8.7 8.7 0 01-3.8-.9L4 19l1.2-3.5A7.4 7.4 0 014.5 11 7.5 7.5 0 1112 18.5"/>
        </svg>
        <p>{{t .Translations "No conversations"}}</p>
    </div>
{{end}}
{{end}}
