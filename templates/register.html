<div class="login-page" x-data="{ loading: false }" @submit.prevent="loading = true; $event.target.submit()">
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/lilmail-favicon.svg" alt="" class="login-logo-img" aria-hidden="true">
            <span class="login-logo-word">lilmail</span>
        </div>

        {{if .Error}}
        <div class="alert alert--error">{{.Error}}</div>
        {{end}}

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="login" class="form-label">{{t .Translations "Login"}}</label>
                <input id="login" name="login" type="text" autocomplete="username" required
                       value="{{.Login}}" placeholder="you@example.com" class="form-input" :disabled="loading">
            </div>
            <div class="form-group">
                <label for="display_name" class="form-label">{{t .Translations "Display name (optional)"}}</label>
                <input id="display_name" name="display_name" type="text" autocomplete="name"
                       value="{{.DisplayName}}" class="form-input" :disabled="loading">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">{{t .Translations "Application password"}}</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required
                       minlength="8" class="form-input" :disabled="loading">
            </div>
            <div class="form-group">
                <label for="password_confirm" class="form-label">{{t .Translations "Confirm password"}}</label>
                <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required
                       minlength="8" class="form-input" :disabled="loading">
            </div>
            <button type="submit" class="btn-primary" :disabled="loading">
                <span x-text="loading ? lmT('Creating…') : lmT('Create account')">{{t .Translations "Create account"}}</span>
            </button>
        </form>

        <p class="form-hint"><a href="/user-login">{{t .Translations "Already have an application account? Sign in"}}</a></p>
        <div class="language-switcher language-switcher--login" aria-label="{{t .Translations "Language"}}">
            <a href="/language?locale=zh-CN&next={{urlEncode .CurrentPath}}" class="{{if eq .Locale "zh-CN"}}is-active{{end}}">简体中文</a>
            <a href="/language?locale=en&next={{urlEncode .CurrentPath}}" class="{{if eq .Locale "en"}}is-active{{end}}">English</a>
        </div>
    </div>
</div>
